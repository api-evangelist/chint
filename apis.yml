name: CHINT
description: >-
  CHINT (Chint Group) is a global smart-energy and intelligent-electrical
  solutions provider founded in 1984 and headquartered in Wenzhou, China, with
  operations across more than 140 countries. Its portfolio spans low-voltage
  electrical equipment (IEC and UL), power transmission and distribution
  systems, switchgear, instruments and meters, EV charging, and clean-energy
  systems including solar PV and battery storage, serving power utilities,
  buildings, telecom and data centers, industrial, and OEM sectors. CHINT does
  not currently publish a public developer API, OpenAPI definition, or developer
  portal; this profile captures the company identity and its public web
  properties. Added to the API Evangelist network as a portfolio company of
  Hongshan (HongShan / former Sequoia China).
